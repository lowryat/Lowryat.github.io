    <style>

<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <!-- Headers (CUSTOMIZE THIS FOR YOUR ART) -->
            <h1>Probability Tides</h1>
            <div class="subtitle">Thousands of correlated, fat-tailed futures drawn as ink. Every seed is a different market obeying the same laws.</div>

            <!-- Seed Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">

                <div class="control-group">
                    <label>Futures (paths)</label>
                    <div class="slider-container">
                        <input type="range" id="paths" min="500" max="6000" step="100" value="2400" oninput="updateParam('paths', this.value)">

                <div class="control-group">

                    <div class="slider-container">

                <div class="control-group">

                        <span class="value-display" id="contours-value">60</span>

            <!-- Colors Section (OPTIONAL - CUSTOMIZE OR REMOVE) -->
            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Worst endings</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#d97757" onchange="updateColor('color1', this.value)">

                        <input type="color" id="color2" value="#6a9bcc" onchange="updateColor('color2', this.value)">

                        <input type="color" id="color3" value="#788c5d" onchange="updateColor('color3', this.value)">

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // GENERATIVE ART PARAMETERS - CUSTOMIZE FOR YOUR ALGORITHM
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 12345,
            paths: 2400,        // how many futures are drawn
            steps: 200,         // how far each future travels
            volatility: 1,      // scale of every step
            coupling: 0.55,     // share of each step taken from the common tide
            tails: 5,           // Student-t degrees of freedom for each path's temperament
            current: 1,         // strength of the slow, shared drift field
            ink: 11,            // stroke opacity (0-255)
            contours: 60,       // opacity of the measured quantile contours (0-100)
            colorPalette: ['#d97757', '#6a9bcc', '#788c5d']
        };

        let defaultParams = {...params, colorPalette: [...params.colorPalette]}; // Store defaults for reset

        // ═══════════════════════════════════════════════════════════════════════
        // P5.JS GENERATIVE ART ALGORITHM - REPLACE WITH YOUR VISION
        // ═══════════════════════════════════════════════════════════════════════

        const MARGIN_X = 92;
        const MARGIN_Y = 118;
        const MEMORY = 0.94;          // turbulence decay per step
        const SHOCK_WEIGHT = 0.04;    // how strongly one step feeds the next step's turbulence
        const TEMPERAMENT_CAP = 3;    // no future is more than three times as restless as the calm
        const QUANTILES = [0.05, 0.25, 0.5, 0.75, 0.95];
        const TIDE_MEMORY = 0.82;     // the shared tide swells instead of chattering
        const FADE_IN = 0.14;         // share of the horizon over which each stroke gathers strength

        let sim = null;
        let drawIndex = 0;
        let rebuildTimer = null;

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            pixelDensity(1);

            initializeSystem();

            // Remove loading message
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            // Seed the randomness for reproducibility
            randomSeed(params.seed);
            noiseSeed(params.seed);

            sim = simulateFutures();
            drawIndex = 0;

            blendMode(BLEND);
            background(250, 249, 245); // Anthropic light background
            layPaperGrain();
            drawBreakEven();
            loop();
        }

        /**
         * Every future is a random walk that is only partly its own. Each step
         * mixes a shock shared by all paths (the tide) with a private shock,
         * rides a slow drift woven from two octaves of noise, and is scaled by
         * two kinds of restlessness: a temperament drawn once per path from a
         * scaled inverse chi-square (so tails are heavy), and a turbulence that
         * remembers recent shocks and decays geometrically (so calm and storm
         * arrive in clusters).
         */
        function simulateFutures() {
            const P = Math.round(params.paths);
            const T = Math.round(params.steps);
            const stride = T + 1;
            const values = new Float32Array(P * stride);
            const stepVol = 0.018 * params.volatility * Math.sqrt(200 / T);
            const tide = Math.sqrt(params.coupling);
            const own = Math.sqrt(1 - params.coupling);
            const df = Math.round(params.tails);

            const common = new Float32Array(T);
            const drift = new Float32Array(T);
            let swell = randomGaussian();
            const renew = Math.sqrt(1 - TIDE_MEMORY * TIDE_MEMORY);
            for (let t = 0; t < T; t++) {
                // Autocorrelated with unit variance: shared shocks arrive as swells.
                swell = TIDE_MEMORY * swell + renew * randomGaussian();
                common[t] = swell;
                const u = t / T;
                const weather = noise(u * 2.4, 7.3) * 0.65 + noise(u * 9.0, 19.1) * 0.35;
                drift[t] = (weather - 0.5) * 0.0055 * params.current * Math.sqrt(200 / T);
            }

            for (let p = 0; p < P; p++) {
                let chi = 0;
                for (let k = 0; k < df; k++) { const g = randomGaussian(); chi += g * g; }
                const temperament = Math.min(TEMPERAMENT_CAP, Math.sqrt(Math.max(1, df - 2) / Math.max(1e-9, chi)));
                let v = 0;
                let turbulence = 1;
                const base = p * stride;
                values[base] = 0;
                for (let t = 0; t < T; t++) {
                    const z = tide * common[t] + own * randomGaussian();
                    const sigma = Math.min(4, Math.sqrt(turbulence));
                    const shock = sigma * z;
                    v += drift[t] + stepVol * temperament * shock;
                    // Mean-reverting memory: persistence MEMORY + SHOCK_WEIGHT, long-run level 1.
                    turbulence = (1 - MEMORY - SHOCK_WEIGHT) + MEMORY * turbulence + SHOCK_WEIGHT * shock * shock;
                    values[base + t + 1] = v;
                }
            }

            // Each path is colored by where it finally arrives.
            const order = new Int32Array(P);
            for (let p = 0; p < P; p++) order[p] = p;
            const byEnding = Array.from(order).sort((a, b) => values[a * stride + T] - values[b * stride + T]);
            const rank = new Float32Array(P);
            byEnding.forEach((p, i) => { rank[p] = P > 1 ? i / (P - 1) : 0.5; });

            // Measured contours: quantiles of every column.
            const bands = QUANTILES.map(() => new Float32Array(stride));
            const column = new Float32Array(P);
            let low = Infinity, high = -Infinity;
            for (let t = 0; t <= T; t++) {
                for (let p = 0; p < P; p++) column[p] = values[p * stride + t];
                column.sort();
                QUANTILES.forEach((q, i) => { bands[i][t] = column[Math.min(P - 1, Math.floor(q * (P - 1)))]; });
                low = Math.min(low, column[Math.floor(0.004 * (P - 1))]);
                high = Math.max(high, column[Math.ceil(0.996 * (P - 1))]);
            }

            // Shuffled drawing order so the tide fills in evenly.
            for (let i = P - 1; i > 0; i--) {
                const j = Math.floor(random(i + 1));
                const swap = order[i]; order[i] = order[j]; order[j] = swap;
            }

            const center = (low + high) / 2;
            const half = Math.max(1e-6, (high - low) / 2) * 1.04;
            return { P, T, stride, values, order, rank, bands, center, half };
        }

        function xAt(t) {
            return MARGIN_X + (t / sim.T) * (width - 2 * MARGIN_X);
        }

        function yAt(v) {
            return height / 2 - ((v - sim.center) / sim.half) * (height / 2 - MARGIN_Y);
        }

        function layPaperGrain() {
            noStroke();
            for (let i = 0; i < 14000; i++) {
                fill(20, 20, 19, random(2, 7));
                const size = random(0.6, 1.4);
                rect(random(width), random(height), size, size);
            }
        }

        function drawBreakEven() {
            const ctx = drawingContext;
            ctx.save();
            ctx.setLineDash([2, 6]);
            ctx.strokeStyle = 'rgba(20, 20, 19, 0.18)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(MARGIN_X, yAt(0));
            ctx.lineTo(width - MARGIN_X, yAt(0));
            ctx.stroke();
            ctx.restore();
        }

        function hexToRgb(hex) {
            const n = parseInt(hex.slice(1), 16);
            return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }

        function mix(a, b, t) {
            return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
        }

        function inkFor(rank) {
            const loss = hexToRgb(params.colorPalette[0]);
            const gain = hexToRgb(params.colorPalette[1]);
            const core = hexToRgb(params.colorPalette[2]);
            // Ease toward the ends so the middle stays quiet and the extremes speak.
            const eased = rank < 0.5 ? Math.pow(rank / 0.5, 1.6) : Math.pow((rank - 0.5) / 0.5, 0.625);
            return rank < 0.5 ? mix(loss, core, eased) : mix(core, gain, eased);
        }

        function drawFuture(p) {
            const ctx = drawingContext;
            const rank = sim.rank[p];
            const tail = rank < 0.05 || rank > 0.95;
            const [r, g, b] = inkFor(rank);
            const alpha = Math.min(1, (params.ink / 255) * (tail ? 1.7 : 1));
            // Each stroke gathers strength after leaving the origin, so the shared
            // starting point glows instead of saturating into a blot.
            const x0 = xAt(0);
            const gradient = ctx.createLinearGradient(x0, 0, x0 + FADE_IN * (width - 2 * MARGIN_X), 0);
            gradient.addColorStop(0, `rgba(${r | 0}, ${g | 0}, ${b | 0}, ${alpha * 0.12})`);
            gradient.addColorStop(1, `rgba(${r | 0}, ${g | 0}, ${b | 0}, ${alpha})`);
            ctx.strokeStyle = gradient;
            ctx.lineWidth = tail ? 0.9 : 0.7;
            ctx.beginPath();
            const base = p * sim.stride;
            ctx.moveTo(xAt(0), yAt(sim.values[base]));
            for (let t = 1; t <= sim.T; t++) ctx.lineTo(xAt(t), yAt(sim.values[base + t]));
            ctx.stroke();
        }

        function drawContours() {
            const strength = params.contours / 100;
            if (strength <= 0) return;
            const ctx = drawingContext;
            ctx.save();
            sim.bands.forEach((band, i) => {
                const q = QUANTILES[i];
                const isMedian = q === 0.5;
                const isTail = q === 0.05 || q === 0.95;
                ctx.setLineDash(isTail ? [7, 7] : []);
                ctx.strokeStyle = `rgba(20, 20, 19, ${strength * (isMedian ? 0.85 : isTail ? 0.6 : 0.4)})`;
                ctx.lineWidth = isMedian ? 1.6 : 1;
                ctx.beginPath();
                ctx.moveTo(xAt(0), yAt(band[0]));
                for (let t = 1; t <= sim.T; t++) ctx.lineTo(xAt(t), yAt(band[t]));
                ctx.stroke();
            });
            // The single point every future shares.
            ctx.setLineDash([]);
            ctx.fillStyle = `rgba(20, 20, 19, ${0.35 + 0.5 * strength})`;
            ctx.beginPath();
            ctx.arc(xAt(0), yAt(0), 3.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function draw() {
            if (!sim) return;
            const batch = Math.max(24, Math.ceil(sim.P / 40));
            blendMode(MULTIPLY);
            for (let k = 0; k < batch && drawIndex < sim.P; k++, drawIndex++) drawFuture(sim.order[drawIndex]);
            blendMode(BLEND);
            if (drawIndex >= sim.P) {
                drawContours();
                noLoop();
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI CONTROL HANDLERS - CUSTOMIZE FOR YOUR PARAMETERS
        // ═══════════════════════════════════════════════════════════════════════

        function scheduleRebuild() {
            clearTimeout(rebuildTimer);
            rebuildTimer = setTimeout(initializeSystem, 120);
        }

        function updateParam(paramName, value) {
            params[paramName] = Number(value);
            document.getElementById(`${paramName}-value`).textContent = value;
            scheduleRebuild();
        }

        function updateColor(colorId, value) {
            const index = { color1: 0, color2: 1, color3: 2 }[colorId];
            params.colorPalette[index] = value;
            document.getElementById(`${colorId}-value`).textContent = value;
            scheduleRebuild();
        }

        function downloadPng() {
            saveCanvas(`probability-tides-seed-${params.seed}`, 'png');
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROL FUNCTIONS - ALWAYS KEEP THESE
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                // Reset to current seed if invalid
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = {...defaultParams, colorPalette: [...defaultParams.colorPalette]};

            // Update UI elements
            for (const key of ['paths', 'steps', 'volatility', 'coupling', 'tails', 'current', 'ink', 'contours']) {
                document.getElementById(key).value = params[key];
                document.getElementById(`${key}-value`).textContent = params[key];
            }

            // Reset colors
            ['color1', 'color2', 'color3'].forEach((id, index) => {
                document.getElementById(id).value = params.colorPalette[index];
                document.getElementById(`${id}-value`).textContent = params.colorPalette[index];
            });

            updateSeedDisplay();
            initializeSystem();
        }

        // Initialize UI on load
        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
