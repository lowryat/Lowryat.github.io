<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portfolio">

<body>
<nav class="nav" id="nav" aria-label="Portfolio">
  <div class="nav-inner">
    <div class="nav-side"><span class="pill" style="background:transparent;color:var(--label-2);padding-left:0">Read-only</span></div>
    <div class="nav-title">Portfolio</div>
    <div class="nav-side right">
      <button class="icon-btn" id="themeBtn" aria-label="Toggle appearance"></button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">

      </button>
    </div>
  </div>
</nav>

<main class="page">
  <header class="header">
    <div>
      <h1 class="large-title">Portfolio</h1>
      <div class="sub subhead secondary" id="asOf">Loading…</div>
    </div>
    <div id="sourcePills" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  </header>

  <div id="status"></div>

  <div class="tabs">
    <div class="segmented" id="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button role="tab" data-tab="tax" aria-selected="false">Tax</button>
      <button role="tab" data-tab="signals" aria-selected="false">Signals</button>
      <button role="tab" data-tab="holdings" aria-selected="false">Holdings</button>
    </div>
    <a class="footnote" href="https://github.com/lowryat/lowryat.github.io/blob/main/portfolio/SETUP.md">Setup guide</a>
  </div>

  <section id="main" aria-live="polite"><div class="empty"><span class="spinner" aria-hidden="true"></span></div></section>

  <footer class="footer" id="footer"></footer>
</main>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="grabber" aria-hidden="true"></div>
  <div class="sheet-h">
    <button class="text-btn" id="sheetCancel">Cancel</button>
    <h2 class="title-3" id="sheetTitle">Settings</h2>
    <button class="text-btn bold" id="sheetDone">Done</button>
  </div>
  <div id="sheetBody"></div>
</div>

<script src="analytics.js"></script>
<script src="app.js"></script>
</body>
</html>
