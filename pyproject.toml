[project]
name = "tradingbot"
version = "0.1.0"
description = "Automated crypto trading bot research framework (risk-managed trend following)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tradingbot*"]
